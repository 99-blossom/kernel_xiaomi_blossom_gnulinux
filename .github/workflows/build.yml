name: Build kernel

on:
  push:

permissions:
  contents: write

env:
  KERNEL_REPO: https://github.com/99-blossom/kernel_xiaomi_blossom_linux
  KERNEL_DIR: kernel_src
  DEFCONFIG: blossom_gnulinux_defconfig
  CROSS_COMPILE: aarch64-linux-gnu-
  CLANG_TRIPLE: aarch64-linux-gnu-
  CCACHE_DIR: /home/runner/.cache/ccache

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            bc \
            bison \
            flex \
            libssl-dev \
            libelf-dev \
            libncurses-dev \
            git \
            curl \
            zip \
            unzip \
            python3 \
            clang \
            lld \
            llvm \
            ccache \
            gcc-aarch64-linux-gnu \
            g++-aarch64-linux-gnu

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-
            ccache-${{ runner.os }}-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --max-size=2G
          ccache --zero-stats
          ccache --show-stats

      - name: Clone kernel sources
        run: |
          git clone --depth=1 --no-tags "$KERNEL_REPO" "$KERNEL_DIR"

      - name: Generate defconfig
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          make ARCH=arm64 O=out ${{ env.DEFCONFIG }}

      - name: Build kernel
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          JOBS=$(nproc)
          make O=out ARCH=arm64 \
            CC="ccache clang" \
            CLANG_TRIPLE=${{ env.CLANG_TRIPLE }} \
            CROSS_COMPILE=${{ env.CROSS_COMPILE }} \
            -j"${JOBS}"

      - name: Show ccache stats
        if: always()
        run: |
          ccache --show-stats

      - name: Check build output
        working-directory: ${{ env.KERNEL_DIR }}
        run: |
          test -s out/arch/arm64/boot/Image
          ls -lh out/arch/arm64/boot/Image
          if [ -s out/arch/arm64/boot/Image.gz ]; then
            ls -lh out/arch/arm64/boot/Image.gz
          fi

      - name: Prepare release tag
        id: tag
        run: |
          echo "tag_name=build-$(date +'%Y%m%d-%H%M%S')-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: kernel-images
          path: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz
          if-no-files-found: warn

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: ${{ steps.tag.outputs.tag_name }}
          files: |
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image
            ${{ env.KERNEL_DIR }}/out/arch/arm64/boot/Image.gz